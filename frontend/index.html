<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AI Language Translator</title>

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <button id="darkModeToggle">
        🌙
    </button>

    <div class="container">

        <h1 class="main-title">
            🌍 AI Language Translator
        </h1>

        <textarea id="inputText"
            placeholder="Enter text here..."></textarea>

        <div class="top-buttons">

            <button id="voiceBtn">
                🎤 Speak
            </button>

            <button id="clearBtn">
                🧹 Clear
            </button>

        </div>

        <div class="language-select">

            <select id="sourceLang">

                <option value="en">
                    🇺🇸 English
                </option>

                <option value="hi">
                    🇮🇳 Hindi
                </option>

                <option value="fr">
                    🇫🇷 French
                </option>

                <option value="es">
                    🇪🇸 Spanish
                </option>

                <option value="de">
                    🇩🇪 German
                </option>

            </select>

            <button id="swapBtn">
                ⇄
            </button>

            <select id="targetLang">

                <option value="hi">
                    🇮🇳 Hindi
                </option>

                <option value="en">
                    🇺🇸 English
                </option>

                <option value="fr">
                    🇫🇷 French
                </option>

                <option value="es">
                    🇪🇸 Spanish
                </option>

                <option value="de">
                    🇩🇪 German
                </option>

            </select>

        </div>

        <div class="char-count">

            Characters:
            <span id="charCount">0</span>

        </div>

        <button id="translateBtn">
            Translate
        </button>

        <div class="spinner"
            id="spinner"></div>

        <div class="output-container">

            <div class="output-header">

                <h3>
                    Translated Text
                </h3>

                <div>

                    <button id="speakBtn">
                        🔊
                    </button>

                    <button id="copyBtn">
                        📋
                    </button>

                </div>

            </div>

            <div class="output-box"
                id="outputText">

                Translation will appear here

            </div>

        </div>

        <div class="history-section">

            <h3>
                📜 Recent Translations
            </h3>

            <div id="historyList"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
